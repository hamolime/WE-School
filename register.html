<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WE School | Modern Register</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="nav-bar">
        <a href="index.html" class="logo">
            <img src="images.jpg" alt="logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">register</a>
            <a href="booking.html">Booking</a>
        </nav>
    </header>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="auth-card">
        <div class="brand">
            <i class="fa-solid fa-bolt brand-icon"></i>
            <h2>WE School</h2>
        </div>

        <div class="auth-header">
            <h3>Create Account 🚀</h3>
            <p>Get started with your free account today</p>
        </div>

        <form class="auth-form" action="#">
            <div class="input-group">
                <i class="fa-regular fa-user input-icon"></i>
                <input type="text" placeholder="Full Name" required>
            </div>

            <div class="input-group">
                <i class="fa-regular fa-envelope input-icon"></i>
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-shield-halved input-icon"></i>
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" required>
                    <span>I agree to <a href="#" class="terms-link">Terms & Conditions</a></span>
                </label>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html" class="switch-link">Sign In</a></p>
        </div>
    </div>

    <footer>
        <p>
            © 2026 WE Applied Technology School (WE ATS). All rights reserved.
        </p>
        <p>Location: Egypt</p>
        <h2>Programmed By: Mohamed Zakaria</h2>
    </footer>

</body>

</html>
